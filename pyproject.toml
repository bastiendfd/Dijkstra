[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shortest-path-exercise"
version = "0.1.0"
description = "A small SciPy-backed shortest-path exercise"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
]

[project.scripts]
shortest-path = "shortest_path:main"

[tool.setuptools]
py-modules = ["shortest_path"]

[tool.pytest.ini_options]
testpaths = ["tests"]
